<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sample project-based experience board</title><desc id="desc">A fictional internship case-study workflow board, clearly marked as demo, not employment.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121827"/><stop offset="1" stop-color="#211a35"/></linearGradient><linearGradient id="violet"><stop stop-color="#a391ff"/><stop offset="1" stop-color="#65d9ce"/></linearGradient></defs>
  <rect width="1440" height="900" fill="url(#bg)"/><text x="84" y="91" fill="#f4f5fb" font-family="Arial,sans-serif" font-size="27" font-weight="700">MAKER / WORKSPACE</text><text x="87" y="139" fill="#9a8cff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">FICTIONAL INTERNSHIP CASE STUDY · DEMO ONLY</text>
  <rect x="82" y="190" width="1276" height="610" rx="24" fill="#1a2031" stroke="#ffffff" stroke-opacity=".13"/>
  <text x="125" y="250" fill="#f4f5fb" font-family="Arial,sans-serif" font-size="29" font-weight="700">From brief to first prototype</text><text x="126" y="286" fill="#99a2b5" font-family="Arial,sans-serif" font-size="17">Illustrative project workflow · no employer or internship is being claimed</text>
  <g font-family="Arial,sans-serif">
    <rect x="124" y="330" width="355" height="384" rx="16" fill="#222b40"/><text x="154" y="375" fill="#aab5ca" font-size="15" font-weight="700" letter-spacing="2">01 / DISCOVER</text><rect x="153" y="403" width="296" height="111" rx="12" fill="#35425a"/><circle cx="210" cy="457" r="28" fill="#9a8cff"/><path d="M265 439h153M265 461h130M265 483h99" stroke="#dce4f0" stroke-width="9" stroke-linecap="round" opacity=".6"/><text x="153" y="558" fill="#f4f5fb" font-size="20" font-weight="700">Understand the task</text><text x="153" y="592" fill="#9da8bb" font-size="15">Define a user need, success</text><text x="153" y="616" fill="#9da8bb" font-size="15">signals and information flow.</text>
    <rect x="542" y="330" width="355" height="384" rx="16" fill="#222b40"/><text x="572" y="375" fill="#aab5ca" font-size="15" font-weight="700" letter-spacing="2">02 / DESIGN</text><rect x="571" y="403" width="296" height="111" rx="12" fill="#34314d"/><rect x="592" y="423" width="73" height="71" rx="9" fill="#a391ff"/><rect x="680" y="423" width="165" height="19" rx="9" fill="#dce4f0" opacity=".76"/><rect x="680" y="454" width="132" height="12" rx="6" fill="#9da8bb" opacity=".7"/><rect x="680" y="477" width="150" height="12" rx="6" fill="#9da8bb" opacity=".45"/><text x="571" y="558" fill="#f4f5fb" font-size="20" font-weight="700">Prototype the flow</text><text x="571" y="592" fill="#9da8bb" font-size="15">Build a clear screen system</text><text x="571" y="616" fill="#9da8bb" font-size="15">and test hierarchy early.</text>
    <rect x="960" y="330" width="355" height="384" rx="16" fill="#222b40"/><text x="990" y="375" fill="#aab5ca" font-size="15" font-weight="700" letter-spacing="2">03 / ITERATE</text><rect x="989" y="403" width="296" height="111" rx="12" fill="#203d42"/><path d="m1018 475 55-43 45 25 65-42 69 40" fill="none" stroke="url(#violet)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="989" y="558" fill="#f4f5fb" font-size="20" font-weight="700">Review &amp; refine</text><text x="989" y="592" fill="#9da8bb" font-size="15">Use feedback to improve</text><text x="989" y="616" fill="#9da8bb" font-size="15">accessibility and usability.</text>
  </g>
  <rect x="512" y="751" width="416" height="35" rx="17" fill="#7a2532"/><text x="720" y="775" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">SAMPLE MOCKUP · NOT REAL EMPLOYMENT</text>
</svg>
