<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Sample certificate artwork — not a credential</title><desc id="desc">Decorative certificate mockup for testing only. It is not issued and does not represent a real qualification.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#f0e8d5"/></linearGradient><linearGradient id="gold"><stop stop-color="#9c7033"/><stop offset=".5" stop-color="#e0bd71"/><stop offset="1" stop-color="#9c7033"/></linearGradient></defs>
  <rect width="1200" height="850" fill="#dfe4e8"/><rect x="42" y="42" width="1116" height="766" rx="12" fill="url(#paper)" stroke="url(#gold)" stroke-width="8"/><rect x="67" y="67" width="1066" height="716" rx="6" fill="none" stroke="#a7844b" stroke-width="2"/>
  <circle cx="600" cy="190" r="43" fill="#263d54"/><path d="m600 158 9 20 22 3-16 15 4 22-19-11-19 11 4-22-16-15 22-3Z" fill="#e1c077"/>
  <text x="600" y="287" fill="#526577" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" letter-spacing="6">SAMPLE LEARNING ARCHIVE</text>
  <text x="600" y="372" fill="#24384d" font-family="Georgia,serif" font-size="57" text-anchor="middle">Certificate of Practice</text>
  <text x="600" y="430" fill="#6c7377" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">This fictional sample layout recognizes practice in</text>
  <text x="600" y="487" fill="#263d54" font-family="Georgia,serif" font-size="36" text-anchor="middle">Frontend Interface Foundations</text>
  <text x="600" y="548" fill="#6c7377" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Issued to</text><text x="600" y="595" fill="#273c50" font-family="Georgia,serif" font-size="33" text-anchor="middle">DEMO PARTICIPANT</text>
  <path d="M290 650h210m190 0h220" stroke="#9d8d70" stroke-width="2"/><text x="395" y="682" fill="#72716a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">SAMPLE DATE</text><text x="800" y="682" fill="#72716a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">NOT AN ISSUER</text>
  <rect x="242" y="716" width="716" height="44" rx="22" fill="#9c2634"/><text x="600" y="745" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="3">SAMPLE ARTWORK · NOT A REAL CREDENTIAL</text>
